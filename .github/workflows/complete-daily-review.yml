name: Complete daily review

on:
  issues:
    types: [closed]

permissions:
  contents: write

jobs:
  update-review-timestamps:
    if: contains(github.event.issue.labels.*.name, 'daily-review')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Update reviewed material timestamps
        run: php scripts/complete-review.php "$GITHUB_EVENT_PATH"

      - name: Commit updated review timestamps
        run: |
          git add -- data/materials.json
          if git diff --cached --quiet; then
            echo "No review timestamps changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update reviewed material timestamps"
          git push
