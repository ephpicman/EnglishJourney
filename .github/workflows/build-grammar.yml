name: Build grammar reference

on:
  workflow_dispatch:
  schedule:
    # 05:00 Iran time (UTC+03:30) every day.
    - cron: '30 1 * * *'

permissions:
  contents: write

jobs:
  render-grammar:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Render grammar pages and index
        run: php scripts/grammar.php

      - name: Commit generated files only when changed
        run: |
          git add -A -- data/grammar grammar grammar.md

          if git diff --cached --quiet; then
            echo "Grammar pages and index are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build grammar reference"
          git push
