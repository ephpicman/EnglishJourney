name: Build word dictionary

on:
  schedule:
    # 06:00 Iran time (UTC+03:30) every day.
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-dictionary:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Render word dictionary
        run: php scripts/word.php

      - name: Commit generated dictionary when changed
        run: |
          if git diff --quiet -- dictionary.md dictionary/; then
            echo "Generated dictionary files are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dictionary.md dictionary/
          git commit -m "Build word dictionary"
          git push
