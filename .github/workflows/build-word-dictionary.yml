name: Build dictionary and reading pages

on:
  workflow_dispatch:
  schedule:
    # 06:00 Iran time (UTC+03:30) every day.
    - cron: '30 2 * * *'

permissions:
  contents: write

jobs:
  render-dictionary:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Render dictionary entries and reading texts
        run: php scripts/dictionary.php

      - name: Commit generated Markdown when changed
        run: |
          git add -A

          if git diff --cached --quiet; then
            echo "Generated Markdown files are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build dictionary and reading pages"
          git push
