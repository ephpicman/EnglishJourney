name: Request Monologue
description: Request an English listening-practice monologue.
title: "[Monologue] "
labels:
  - request-monologue
body:
  - type: markdown
    attributes:
      value: |
        Request one single-speaker English monologue for listening and speaking practice.
        Professional topics must be specifically related to PHP, web development, software engineering, or IT.
  - type: input
    id: topic
    attributes:
      label: Topic
      description: What should the speaker talk about?
      placeholder: "For example, how a PHP application handles an HTTP request"
    validations:
      required: true
  - type: dropdown
    id: context
    attributes:
      label: Context
      description: Select the setting and style of the monologue.
      options:
        - "Everyday life (ielts-listening-part-2)"
        - "Academic (ielts-listening-part-4)"
        - "Professional (PHP, web development, and IT)"
    validations:
      required: true
  - type: textarea
    id: preferences
    attributes:
      label: Additional preferences (optional)
      description: Mention a target level, useful vocabulary, or any specific angle. For professional topics, keep the subject within PHP, web, software engineering, or IT.
      placeholder: Optional
    validations:
      required: false
